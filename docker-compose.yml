services:
  # 中文：PostgreSQL 是 SaaS 账号、文件元数据、套餐和任务状态的持久化数据源。
  # English: PostgreSQL durably stores SaaS accounts, file metadata, plans, and task records.
  postgres:
    image: postgres:17
    container_name: ai-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      # 中文/English：生产和本地私有环境都必须提供数据库密码 / Set the database password in the private local or production environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # 中文：Redis 用于健康检查和任务处理期间的 Excel 行集缓存。
    # English: Redis is health-checked by the backend and stores temporary per-task Excel rows.
    image: redis:8-alpine
    container_name: ai-agent-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent-service:
    # 中文：Python/LangGraph 负责理解提示词并决定调用哪些 Java 工具。
    # English: Python/LangGraph interprets prompts and decides which Java tools to call.
    build:
      context: ./agent-service
    container_name: ai-agent-service
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      REMOTE_LLM_PROVIDER: ${REMOTE_LLM_PROVIDER:-openai-compatible}
      REMOTE_LLM_BASE_URL: ${REMOTE_LLM_BASE_URL:-}
      REMOTE_LLM_API_KEY: ${REMOTE_LLM_API_KEY:-}
      REMOTE_LLM_MODEL: ${REMOTE_LLM_MODEL:-}
      JAVA_TOOL_REGISTRY_URL: http://backend:8080/internal/agent/tools
      JAVA_TOOL_PRINCIPAL: langgraph
      JAVA_TOOL_HTTP_TIMEOUT: ${JAVA_TOOL_HTTP_TIMEOUT:-75}
      # 中文/English：仅 Agent 与后端共享的内部鉴权令牌 / Internal service token shared with the backend.
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AGENT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    # 中文：Spring Boot 承载页面、认证、业务 API、文件存储适配、任务 Worker 和 Java Tool Registry。
    # English: Spring Boot serves the UI, auth/business APIs, file-storage adapter, task worker, and Java Tool Registry.
    build:
      context: ./backend
    container_name: ai-agent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agent}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AGENT_SERVICE_URL: http://agent-service:8000
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RATE_LIMIT_REGISTRATION_MAX_REQUESTS: ${RATE_LIMIT_REGISTRATION_MAX_REQUESTS:-5}
      RATE_LIMIT_REGISTRATION_WINDOW: ${RATE_LIMIT_REGISTRATION_WINDOW:-1h}
      RATE_LIMIT_LOGIN_MAX_REQUESTS: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:-10}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-15m}
      RATE_LIMIT_TASKS_MAX_REQUESTS: ${RATE_LIMIT_TASKS_MAX_REQUESTS:-10}
      RATE_LIMIT_TASKS_WINDOW: ${RATE_LIMIT_TASKS_WINDOW:-1m}
      APP_STORAGE_ROOT: /app/data/files
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # 中文：命名卷让容器重建后仍保留用户上传和生成的工作簿。
      # English: The named volume preserves uploaded and generated workbooks across container recreation.
      - excel_files:/app/data/files
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  excel_files:
